<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <text x="440" y="34" font-size="19" font-weight="700" fill="#1f2430" text-anchor="middle">发布前伦理自查：五问定生死</text>
  <rect x="40" y="70" width="152" height="120" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="116" y="104" font-size="15.5" font-weight="700" fill="#4338ca" text-anchor="middle">① 责任</text>
  <text x="116" y="134" font-size="12.5" fill="#475569" text-anchor="middle">出问题谁负责？</text>
  <text x="116" y="156" font-size="12.5" fill="#475569" text-anchor="middle">人在最终把关吗？</text>
  <rect x="206" y="70" width="152" height="120" rx="14" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
  <text x="282" y="104" font-size="15.5" font-weight="700" fill="#0f766e" text-anchor="middle">② 透明</text>
  <text x="282" y="134" font-size="12.5" fill="#115e59" text-anchor="middle">用户知道是 AI 吗？</text>
  <text x="282" y="156" font-size="12.5" fill="#115e59" text-anchor="middle">边界说清了吗？</text>
  <rect x="372" y="70" width="152" height="120" rx="14" fill="#fdf2f8" stroke="#ec4899" stroke-width="2"/>
  <text x="448" y="104" font-size="15.5" font-weight="700" fill="#be185d" text-anchor="middle">③ 公平</text>
  <text x="448" y="134" font-size="12.5" fill="#9d174d" text-anchor="middle">对不同人群公平吗？</text>
  <text x="448" y="156" font-size="12.5" fill="#9d174d" text-anchor="middle">偏见被放大吗？</text>
  <rect x="538" y="70" width="152" height="120" rx="14" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
  <text x="614" y="104" font-size="15.5" font-weight="700" fill="#b45309" text-anchor="middle">④ 隐私</text>
  <text x="614" y="134" font-size="12.5" fill="#92400e" text-anchor="middle">存了什么数据？</text>
  <text x="614" y="156" font-size="12.5" fill="#92400e" text-anchor="middle">能查能删吗？</text>
  <rect x="704" y="70" width="136" height="120" rx="14" fill="#e6f7f4" stroke="#0d9488" stroke-width="2"/>
  <text x="772" y="104" font-size="15.5" font-weight="700" fill="#0f766e" text-anchor="middle">⑤ 滥用</text>
  <text x="772" y="134" font-size="12.5" fill="#115e59" text-anchor="middle">被坏人用会怎样？</text>
  <text x="772" y="156" font-size="12.5" fill="#115e59" text-anchor="middle">有限制吗？</text>

  <rect x="150" y="222" width="580" height="56" rx="14" fill="#fff" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="440" y="254" font-size="14.5" fill="#334155" text-anchor="middle">任何一问答不上来 → 先别发布，回去补设计</text>

  <rect x="250" y="298" width="380" height="44" rx="12" fill="#f6f7fb" stroke="#e5e8ef"/>
  <text x="440" y="326" font-size="13.5" fill="#475569" text-anchor="middle">把安全与伦理当功能设计，而不是上线前补丁</text>
</svg>
