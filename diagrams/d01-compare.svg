<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="c-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#66707f"/>
    </marker>
  </defs>

  <!-- left: traditional -->
  <text x="215" y="42" font-size="18" font-weight="700" fill="#475569" text-anchor="middle">传统程序（规则写死）</text>
  <rect x="40" y="60" width="350" height="360" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="70" y="92" width="290" height="52" rx="12" fill="#fff" stroke="#94a3b8"/>
  <text x="215" y="124" font-size="14.5" fill="#334155" text-anchor="middle">用户输入（固定的几种格式）</text>
  <line x1="215" y1="144" x2="215" y2="170" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#c-arr)"/>
  <rect x="70" y="172" width="290" height="90" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="215" y="202" font-size="14.5" font-weight="700" fill="#4338ca" text-anchor="middle">if / else 条件判断</text>
  <text x="215" y="228" font-size="13" fill="#64748b" text-anchor="middle">程序员预先写好每一种情况</text>
  <text x="215" y="250" font-size="13" fill="#64748b" text-anchor="middle">遇到没写过的情况 = 出错</text>
  <line x1="215" y1="262" x2="215" y2="288" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#c-arr)"/>
  <rect x="70" y="290" width="290" height="52" rx="12" fill="#fff" stroke="#94a3b8"/>
  <text x="215" y="322" font-size="14.5" fill="#334155" text-anchor="middle">输出固定结果</text>
  <text x="215" y="394" font-size="12.5" fill="#64748b" text-anchor="middle">优点：稳定、可预测　缺点：僵硬、只能做“规定动作”</text>

  <!-- right: agent -->
  <text x="645" y="42" font-size="18" font-weight="700" fill="#0f766e" text-anchor="middle">AI Agent（目标驱动）</text>
  <rect x="470" y="60" width="350" height="360" rx="20" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
  <rect x="500" y="92" width="290" height="52" rx="12" fill="#fff" stroke="#0d9488"/>
  <text x="645" y="116" font-size="14.5" fill="#0f766e" text-anchor="middle">用户目标（自然语言，怎么都行）</text>
  <text x="645" y="137" font-size="12.5" fill="#64748b" text-anchor="middle">“帮我安排一场周三的客户会议”</text>
  <line x1="645" y1="144" x2="645" y2="168" stroke="#0d9488" stroke-width="1.6" marker-end="url(#c-arr)"/>
  <rect x="500" y="170" width="290" height="110" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
  <text x="645" y="198" font-size="14.5" font-weight="700" fill="#0f766e" text-anchor="middle">LLM 大脑：理解 → 规划 → 决策</text>
  <text x="645" y="224" font-size="13" fill="#115e59" text-anchor="middle">1. 检查日程　2. 查空闲时间</text>
  <text x="645" y="246" font-size="13" fill="#115e59" text-anchor="middle">3. 发邀请　4. 汇报结果</text>
  <text x="645" y="268" font-size="13" fill="#115e59" text-anchor="middle">没见过的任务也能现场拆解</text>
  <line x1="645" y1="280" x2="645" y2="304" stroke="#0d9488" stroke-width="1.6" marker-end="url(#c-arr)"/>
  <rect x="500" y="306" width="290" height="52" rx="12" fill="#fff" stroke="#0d9488"/>
  <text x="645" y="330" font-size="14.5" fill="#0f766e" text-anchor="middle">调用工具：日历 / 邮件 / 搜索…</text>
  <text x="645" y="352" font-size="13" fill="#115e59" text-anchor="middle">并观察结果，必要时调整方案</text>
  <text x="645" y="394" font-size="12.5" fill="#64748b" text-anchor="middle">优点：灵活、能应对开放任务　缺点：需要约束与监督</text>
</svg>
