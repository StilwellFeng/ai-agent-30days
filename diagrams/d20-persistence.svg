<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs><marker id="P" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/></marker></defs>
  <text x="440" y="34" font-size="19" font-weight="700" fill="#1f2430" text-anchor="middle">状态持久化：让 Agent“下回还记得”</text>

  <rect x="50" y="80" width="200" height="110" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="150" y="112" font-size="15" font-weight="700" fill="#4338ca" text-anchor="middle">会话/消息历史</text>
  <text x="150" y="140" font-size="13" fill="#475569" text-anchor="middle">存数据库表：</text>
  <text x="150" y="162" font-size="12.5" fill="#475569" text-anchor="middle">session_id, role, content</text>
  <text x="150" y="182" font-size="12" fill="#94a3b8" text-anchor="middle">重启后能接着聊</text>
  <line x1="250" y1="135" x2="290" y2="135" stroke="#4f46e5" stroke-width="1.8" marker-end="url(#P)"/>

  <rect x="294" y="80" width="200" height="110" rx="14" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
  <text x="394" y="112" font-size="15" font-weight="700" fill="#0f766e" text-anchor="middle">用户画像/偏好</text>
  <text x="394" y="140" font-size="13" fill="#115e59" text-anchor="middle">关键事实单独抽出来存：</text>
  <text x="394" y="162" font-size="12.5" fill="#115e59" text-anchor="middle">“用户住上海、预算敏感”</text>
  <text x="394" y="182" font-size="12" fill="#94a3b8" text-anchor="middle">每轮可注入系统提示</text>
  <line x1="494" y1="135" x2="534" y2="135" stroke="#4f46e5" stroke-width="1.8" marker-end="url(#P)"/>

  <rect x="538" y="80" width="200" height="110" rx="14" fill="#fdf2f8" stroke="#ec4899" stroke-width="2"/>
  <text x="638" y="112" font-size="15" font-weight="700" fill="#be185d" text-anchor="middle">任务/知识库</text>
  <text x="638" y="140" font-size="13" fill="#9d174d" text-anchor="middle">长期记忆向量库 + 文档</text>
  <text x="638" y="162" font-size="12.5" fill="#9d174d" text-anchor="middle">（Day 6 / 11 讲过）</text>
  <text x="638" y="182" font-size="12" fill="#94a3b8" text-anchor="middle">随取随用</text>

  <rect x="150" y="230" width="580" height="92" rx="16" fill="#fff" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="440" y="262" font-size="15.5" font-weight="700" fill="#1f2430" text-anchor="middle">什么时候该抽出来“持久化”而不是留在对话里？</text>
  <text x="440" y="292" font-size="13.5" fill="#475569" text-anchor="middle">· 下次会话还要用（用户偏好/结论）　· 可能被摘要“压丢”（关键事实/数字）</text>
  <text x="440" y="312" font-size="13.5" fill="#475569" text-anchor="middle">· 成本高不值得每轮重算（缓存/落库）—— 记住：能存就别反复让模型“想”</text>
</svg>
