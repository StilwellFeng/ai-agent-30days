<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <text x="440" y="34" font-size="19" font-weight="700" fill="#1f2430" text-anchor="middle">成本 = Token × 单价 × 调用次数：三个旋钮一起拧</text>
  <rect x="40" y="80" width="250" height="150" rx="16" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="165" y="112" font-size="17" font-weight="700" fill="#4338ca" text-anchor="middle">① 调用次数</text>
  <text x="165" y="142" font-size="13" fill="#475569" text-anchor="middle">能不用 LLM 就不用（规则/查表）</text>
  <text x="165" y="164" font-size="13" fill="#475569" text-anchor="middle">合并步骤、避免无谓重试</text>
  <text x="165" y="200" font-size="13" font-weight="700" fill="#4338ca" text-anchor="middle">杠杆最大</text>

  <rect x="315" y="80" width="250" height="150" rx="16" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
  <text x="440" y="112" font-size="17" font-weight="700" fill="#0f766e" text-anchor="middle">② Token 数</text>
  <text x="440" y="142" font-size="13" fill="#115e59" text-anchor="middle">上下文只放相关片段（Day 9）</text>
  <text x="440" y="164" font-size="13" fill="#115e59" text-anchor="middle">压缩历史、限制输出长度</text>
  <text x="440" y="200" font-size="13" font-weight="700" fill="#0f766e" text-anchor="middle">立竿见影</text>

  <rect x="590" y="80" width="250" height="150" rx="16" fill="#fdf2f8" stroke="#ec4899" stroke-width="2"/>
  <text x="715" y="112" font-size="17" font-weight="700" fill="#be185d" text-anchor="middle">③ 单价</text>
  <text x="715" y="142" font-size="13" fill="#9d174d" text-anchor="middle">简单任务用便宜/小模型</text>
  <text x="715" y="164" font-size="13" fill="#9d174d" text-anchor="middle">缓存重复前缀与结果</text>
  <text x="715" y="200" font-size="13" font-weight="700" fill="#be185d" text-anchor="middle">长期省钱</text>

  <rect x="150" y="252" width="580" height="52" rx="14" fill="#fff" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="440" y="283" font-size="14" fill="#334155" text-anchor="middle">先算账：把每月最贵的 3 笔调用列出来，再决定先拧哪个旋钮</text>
</svg>
