<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs><marker id="I" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/></marker></defs>
  <text x="440" y="34" font-size="19" font-weight="700" fill="#1f2430" text-anchor="middle">Day 21 实战：自动化信息收集助手（定时任务）</text>

  <rect x="40" y="80" width="170" height="96" rx="14" fill="#fdf2f8" stroke="#ec4899" stroke-width="2"/>
  <text x="125" y="112" font-size="15" font-weight="700" fill="#be185d" text-anchor="middle">⏰ 定时触发</text>
  <text x="125" y="140" font-size="12.5" fill="#9d174d" text-anchor="middle">每天早上 8:00 /</text>
  <text x="125" y="160" font-size="12.5" fill="#9d174d" text-anchor="middle">每周一 9:00</text>
  <line x1="210" y1="128" x2="252" y2="128" stroke="#4f46e5" stroke-width="2" marker-end="url(#I)"/>

  <rect x="256" y="80" width="170" height="96" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="341" y="112" font-size="15" font-weight="700" fill="#4338ca" text-anchor="middle">🔍 采集</text>
  <text x="341" y="140" font-size="12.5" fill="#475569" text-anchor="middle">抓 RSS/网页/API</text>
  <text x="341" y="160" font-size="12.5" fill="#475569" text-anchor="middle">（尊重对方规则与频率）</text>
  <line x1="426" y1="128" x2="468" y2="128" stroke="#4f46e5" stroke-width="2" marker-end="url(#I)"/>

  <rect x="472" y="80" width="170" height="96" rx="14" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
  <text x="557" y="112" font-size="15" font-weight="700" fill="#0f766e" text-anchor="middle">🧹 清洗+总结</text>
  <text x="557" y="140" font-size="12.5" fill="#115e59" text-anchor="middle">去重、抽要点、</text>
  <text x="557" y="160" font-size="12.5" fill="#115e59" text-anchor="middle">按你的兴趣过滤</text>
  <line x1="642" y1="128" x2="684" y2="128" stroke="#4f46e5" stroke-width="2" marker-end="url(#I)"/>

  <rect x="688" y="80" width="152" height="96" rx="14" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
  <text x="764" y="112" font-size="15" font-weight="700" fill="#b45309" text-anchor="middle">📤 交付</text>
  <text x="764" y="140" font-size="12.5" fill="#92400e" text-anchor="middle">邮件/推送/</text>
  <text x="764" y="160" font-size="12.5" fill="#92400e" text-anchor="middle">Markdown 报告</text>

  <rect x="120" y="210" width="640" height="112" rx="16" fill="#fff" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="440" y="242" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle">与“每轮问 LLM”不同：这是无人值守的流水线</text>
  <text x="440" y="272" font-size="13.5" fill="#475569" text-anchor="middle">工程要点：抓取失败要重试/告警；输出要稳定可解析；</text>
  <text x="440" y="296" font-size="13.5" fill="#475569" text-anchor="middle">LLM 只做“清洗/总结”这类它擅长的环节，采集与定时交给可靠程序</text>
</svg>
