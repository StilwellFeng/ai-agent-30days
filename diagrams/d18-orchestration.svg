<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs><marker id="O" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/></marker></defs>
  <text x="440" y="34" font-size="19" font-weight="700" fill="#1f2430" text-anchor="middle">多步骤任务编排：步骤之间怎么“交接”</text>

  <rect x="40" y="80" width="200" height="90" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="140" y="112" font-size="15" font-weight="700" fill="#4338ca" text-anchor="middle">① 收集</text>
  <text x="140" y="138" font-size="13" fill="#475569" text-anchor="middle">抓取/输入原始材料</text>
  <text x="140" y="158" font-size="12.5" fill="#94a3b8" text-anchor="middle">输出：材料清单</text>
  <line x1="240" y1="125" x2="286" y2="125" stroke="#4f46e5" stroke-width="2" marker-end="url(#O)"/>

  <rect x="290" y="80" width="200" height="90" rx="14" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
  <text x="390" y="112" font-size="15" font-weight="700" fill="#0f766e" text-anchor="middle">② 处理</text>
  <text x="390" y="138" font-size="13" fill="#115e59" text-anchor="middle">清洗/总结/结构化</text>
  <text x="390" y="158" font-size="12.5" fill="#94a3b8" text-anchor="middle">输出：结构化结果</text>
  <line x1="490" y1="125" x2="536" y2="125" stroke="#4f46e5" stroke-width="2" marker-end="url(#O)"/>

  <rect x="540" y="80" width="200" height="90" rx="14" fill="#fdf2f8" stroke="#ec4899" stroke-width="2"/>
  <text x="640" y="112" font-size="15" font-weight="700" fill="#be185d" text-anchor="middle">③ 交付</text>
  <text x="640" y="138" font-size="13" fill="#9d174d" text-anchor="middle">生成报告/发消息/入库</text>
  <text x="640" y="158" font-size="12.5" fill="#94a3b8" text-anchor="middle">输出：最终交付物</text>

  <rect x="120" y="210" width="640" height="150" rx="16" fill="#fff" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="440" y="242" font-size="15.5" font-weight="700" fill="#1f2430" text-anchor="middle">编排的四个工程要点</text>
  <text x="160" y="274" font-size="13.5" fill="#475569" text-anchor="middle">· 每步输入/输出要“结构化、可校验”，而不是纯文本互相甩锅</text>
  <text x="160" y="300" font-size="13.5" fill="#475569" text-anchor="middle">· 每步设重试与失败分支（步骤挂了走哪条路要提前想好）</text>
  <text x="160" y="326" font-size="13.5" fill="#475569" text-anchor="middle">· 记录每步耗时与 Token 成本，找出“贵又没用”的步骤</text>
  <text x="160" y="352" font-size="13.5" fill="#475569" text-anchor="middle">· 允许人工介入：关键交付前先给用户确认</text>
</svg>
