<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <text x="440" y="34" font-size="19" font-weight="700" fill="#1f2430" text-anchor="middle">装配七步：像装电脑一样组装 Agent</text>
  <rect x="40" y="80" width="800" height="140" rx="18" fill="#f6f7fb" stroke="#e5e8ef"/>
  <rect x="60" y="100" width="105" height="100" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.8"/>
  <text x="112" y="132" font-size="14" font-weight="700" fill="#4338ca" text-anchor="middle">① 定需求</text>
  <text x="112" y="160" font-size="11.5" fill="#475569" text-anchor="middle">做什么/不做什么</text>
  <text x="112" y="180" font-size="11.5" fill="#94a3b8" text-anchor="middle">成功长什么样</text>
  <rect x="180" y="100" width="105" height="100" rx="12" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.8"/>
  <text x="232" y="132" font-size="14" font-weight="700" fill="#0f766e" text-anchor="middle">② 选模型</text>
  <text x="232" y="160" font-size="11.5" fill="#115e59" text-anchor="middle">质量/成本/隐私</text>
  <text x="232" y="180" font-size="11.5" fill="#94a3b8" text-anchor="middle">先求跑通</text>
  <rect x="300" y="100" width="105" height="100" rx="12" fill="#fdf2f8" stroke="#ec4899" stroke-width="1.8"/>
  <text x="352" y="132" font-size="14" font-weight="700" fill="#be185d" text-anchor="middle">③ 提示词</text>
  <text x="352" y="160" font-size="11.5" fill="#9d174d" text-anchor="middle">身份/边界/格式</text>
  <text x="352" y="180" font-size="11.5" fill="#94a3b8" text-anchor="middle">独立成文件</text>
  <rect x="420" y="100" width="105" height="100" rx="12" fill="#fff7ed" stroke="#d97706" stroke-width="1.8"/>
  <text x="472" y="132" font-size="14" font-weight="700" fill="#b45309" text-anchor="middle">④ 工具</text>
  <text x="472" y="160" font-size="11.5" fill="#92400e" text-anchor="middle">注册 + 说明书</text>
  <text x="472" y="180" font-size="11.5" fill="#94a3b8" text-anchor="middle">越少越清楚</text>
  <rect x="540" y="100" width="105" height="100" rx="12" fill="#e6f7f4" stroke="#0d9488" stroke-width="1.8"/>
  <text x="592" y="132" font-size="14" font-weight="700" fill="#0f766e" text-anchor="middle">⑤ 记忆</text>
  <text x="592" y="160" font-size="11.5" fill="#115e59" text-anchor="middle">先最简历史</text>
  <text x="592" y="180" font-size="11.5" fill="#94a3b8" text-anchor="middle">再升级画像</text>
  <rect x="660" y="100" width="105" height="100" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="1.8"/>
  <text x="712" y="132" font-size="14" font-weight="700" fill="#4338ca" text-anchor="middle">⑥ 自检</text>
  <text x="712" y="160" font-size="11.5" fill="#475569" text-anchor="middle">5 类测试问题</text>
  <text x="712" y="180" font-size="11.5" fill="#94a3b8" text-anchor="middle">顺利+失败路径</text>

  <rect x="290" y="236" width="300" height="44" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="440" y="264" font-size="14" fill="#334155" text-anchor="middle">⑦ 加护栏：步数/超时/日志/危险确认</text>
</svg>
