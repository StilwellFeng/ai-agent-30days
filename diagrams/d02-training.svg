<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="tr-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#66707f"/>
    </marker>
  </defs>
  <text x="440" y="34" font-size="19" font-weight="700" fill="#1f2430" text-anchor="middle">一个大模型是怎么“养”出来的（简化）</text>

  <rect x="30" y="66" width="250" height="200" rx="16" fill="#fff" stroke="#4f46e5" stroke-width="2"/>
  <text x="155" y="96" font-size="15.5" font-weight="700" fill="#4338ca" text-anchor="middle">① 预训练</text>
  <text x="155" y="124" font-size="13" fill="#475569" text-anchor="middle">喂给模型几乎全互联网的文本</text>
  <text x="155" y="148" font-size="13" fill="#475569" text-anchor="middle">（万亿级 Token）</text>
  <text x="155" y="172" font-size="13" fill="#475569" text-anchor="middle">反复练习“猜下一个词”</text>
  <text x="155" y="204" font-size="12.5" fill="#94a3b8" text-anchor="middle">结果：学会语言、知识、推理的“底子”</text>
  <text x="155" y="240" font-size="13" fill="#4338ca" text-anchor="middle">成本最高，只有大公司做</text>
  <line x1="280" y1="166" x2="322" y2="166" stroke="#66707f" stroke-width="1.8" marker-end="url(#tr-arr)"/>

  <rect x="326" y="66" width="250" height="200" rx="16" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="451" y="96" font-size="15.5" font-weight="700" fill="#6d28d9" text-anchor="middle">② 监督微调 SFT</text>
  <text x="451" y="124" font-size="13" fill="#475569" text-anchor="middle">用人写的“好问答”例子</text>
  <text x="451" y="148" font-size="13" fill="#475569" text-anchor="middle">教它学会对话、听从指令</text>
  <text x="451" y="204" font-size="12.5" fill="#94a3b8" text-anchor="middle">结果：从“接词机器”变成“助手”</text>
  <text x="451" y="240" font-size="13" fill="#6d28d9" text-anchor="middle">中等成本</text>
  <line x1="576" y1="166" x2="618" y2="166" stroke="#66707f" stroke-width="1.8" marker-end="url(#tr-arr)"/>

  <rect x="622" y="66" width="240" height="200" rx="16" fill="#e6f7f4" stroke="#0d9488" stroke-width="2"/>
  <text x="742" y="96" font-size="15.5" font-weight="700" fill="#0f766e" text-anchor="middle">③ 人类反馈 RLHF</text>
  <text x="742" y="124" font-size="13" fill="#475569" text-anchor="middle">让模型生成多个回答，</text>
  <text x="742" y="148" font-size="13" fill="#475569" text-anchor="middle">由人（或模型）打分排序</text>
  <text x="742" y="204" font-size="12.5" fill="#94a3b8" text-anchor="middle">结果：更听话、更安全、更有用</text>
  <text x="742" y="240" font-size="13" fill="#0f766e" text-anchor="middle">持续进行中</text>

  <text x="440" y="300" font-size="13.5" fill="#66707f" text-anchor="middle">对我们学习者：平时用的都是成品模型 —— 重点是学会“怎么用好它”，而不是自己训练</text>
</svg>
