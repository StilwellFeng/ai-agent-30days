<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="t-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#66707f"/>
    </marker>
  </defs>

  <text x="440" y="34" font-size="19" font-weight="700" fill="#1f2430" text-anchor="middle">LLM 的“猜词游戏”：一次只预测下一个 Token</text>

  <rect x="30" y="70" width="200" height="96" rx="14" fill="#fff" stroke="#4f46e5" stroke-width="2"/>
  <text x="130" y="100" font-size="14.5" font-weight="700" fill="#4338ca" text-anchor="middle">输入文本</text>
  <text x="130" y="124" font-size="13" fill="#475569" text-anchor="middle">“今天天气很”</text>
  <text x="130" y="148" font-size="12" fill="#94a3b8" text-anchor="middle">（会被切成小块 Token）</text>
  <line x1="230" y1="118" x2="282" y2="118" stroke="#66707f" stroke-width="1.8" marker-end="url(#t-arr)"/>

  <rect x="286" y="70" width="210" height="96" rx="14" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="391" y="100" font-size="14.5" font-weight="700" fill="#4338ca" text-anchor="middle">大语言模型</text>
  <text x="391" y="124" font-size="13" fill="#475569" text-anchor="middle">给每个可能的词打分</text>
  <text x="391" y="148" font-size="12" fill="#94a3b8" text-anchor="middle">（上千亿参数一起计算）</text>
  <line x1="496" y1="118" x2="548" y2="118" stroke="#66707f" stroke-width="1.8" marker-end="url(#t-arr)"/>

  <rect x="552" y="70" width="298" height="96" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="701" y="98" font-size="14.5" font-weight="700" fill="#6d28d9" text-anchor="middle">概率分布（例）</text>
  <text x="580" y="124" font-size="12.5" fill="#7c3aed" text-anchor="middle">好：58%</text>
  <text x="670" y="124" font-size="12.5" fill="#7c3aed" text-anchor="middle">晴：24%</text>
  <text x="770" y="124" font-size="12.5" fill="#7c3aed" text-anchor="middle">冷：9%</text>
  <text x="580" y="150" font-size="12.5" fill="#94a3b8" text-anchor="middle">糟糕：2%</text>
  <text x="701" y="150" font-size="11.5" fill="#94a3b8" text-anchor="middle">… 其余几万个词都很低</text>

  <!-- loop -->
  <path d="M 701 166 L 701 250 L 130 250 L 130 166" fill="none" stroke="#0d9488" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#t-arr)"/>
  <text x="416" y="244" font-size="13" fill="#0f766e" text-anchor="middle">把选出的词接回输入，继续猜下一个 → 直到出现结束符</text>

  <rect x="300" y="282" width="310" height="92" rx="16" fill="#e6f7f4" stroke="#0d9488" stroke-width="2"/>
  <text x="455" y="312" font-size="15" font-weight="700" fill="#0f766e" text-anchor="middle">所以模型“懂”吗？</text>
  <text x="455" y="338" font-size="13" fill="#115e59" text-anchor="middle">它学的是海量文本中的统计规律，</text>
  <text x="455" y="360" font-size="13" fill="#115e59" text-anchor="middle">不是人类那种“查资料 + 求证”的理解</text>

  <text x="60" y="330" font-size="13.5" fill="#66707f">这就是后面会讲到的：</text>
  <text x="60" y="352" font-size="13.5" fill="#66707f">幻觉 = 模型“自信地编”</text>
</svg>
