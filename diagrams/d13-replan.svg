<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs><marker id="R3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/></marker></defs>
  <text x="440" y="34" font-size="19" font-weight="700" fill="#1f2430" text-anchor="middle">规划的三种强度：从“写死”到“边做边想”</text>

  <rect x="40" y="70" width="250" height="150" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="165" y="100" font-size="15" font-weight="700" fill="#475569" text-anchor="middle">① 固定流程（Workflow）</text>
  <text x="165" y="128" font-size="13" fill="#64748b" text-anchor="middle">步骤写死：1→2→3→4</text>
  <text x="165" y="152" font-size="13" fill="#64748b" text-anchor="middle">稳定、便宜、可预测</text>
  <text x="165" y="176" font-size="13" fill="#64748b" text-anchor="middle">适合流程不变的场景</text>
  <text x="165" y="200" font-size="12" fill="#94a3b8" text-anchor="middle">例：每日自动汇总邮件</text>

  <rect x="315" y="70" width="250" height="150" rx="16" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="440" y="100" font-size="15" font-weight="700" fill="#4338ca" text-anchor="middle">② ReAct（想一步做一步）</text>
  <text x="440" y="128" font-size="13" fill="#475569" text-anchor="middle">Thought→Action→Observation</text>
  <text x="440" y="152" font-size="13" fill="#475569" text-anchor="middle">每步都看结果再决定下一步</text>
  <text x="440" y="176" font-size="13" fill="#475569" text-anchor="middle">灵活，适合开放式任务</text>
  <text x="440" y="200" font-size="12" fill="#94a3b8" text-anchor="middle">例：帮我规划一次旅行</text>

  <rect x="590" y="70" width="250" height="150" rx="16" fill="#fdf2f8" stroke="#ec4899" stroke-width="2"/>
  <text x="715" y="100" font-size="15" font-weight="700" fill="#be185d" text-anchor="middle">③ 反思（Reflection）</text>
  <text x="715" y="128" font-size="13" fill="#9d174d" text-anchor="middle">做完一步先“自我检查”</text>
  <text x="715" y="152" font-size="13" fill="#9d174d" text-anchor="middle">发现问题→改方案→重做</text>
  <text x="715" y="176" font-size="13" fill="#9d174d" text-anchor="middle">质量更高但更慢更贵</text>
  <text x="715" y="200" font-size="12" fill="#94a3b8" text-anchor="middle">例：写代码后自查再提交</text>

  <rect x="130" y="262" width="620" height="100" rx="16" fill="#fff" stroke="#e5e8ef"/>
  <text x="440" y="294" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle">工程选择口诀</text>
  <text x="440" y="322" font-size="13.5" fill="#475569" text-anchor="middle">任务越稳定 → 越用固定流程（省）　任务越开放 → 越需要 ReAct/反思（稳）</text>
  <text x="440" y="346" font-size="12.5" fill="#94a3b8" text-anchor="middle">别忘了给“最大步数/超时/预算”兜底，防止它无限循环</text>
</svg>
