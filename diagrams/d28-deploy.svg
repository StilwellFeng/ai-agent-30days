<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs><marker id="D" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/></marker></defs>
  <text x="440" y="34" font-size="19" font-weight="700" fill="#1f2430" text-anchor="middle">把 Agent 部署成服务（最小拓扑）</text>

  <rect x="40" y="90" width="160" height="90" rx="14" fill="#fdf2f8" stroke="#ec4899" stroke-width="2"/>
  <text x="120" y="122" font-size="15" font-weight="700" fill="#be185d" text-anchor="middle">用户</text>
  <text x="120" y="150" font-size="12.5" fill="#9d174d" text-anchor="middle">网页 / 手机 / 命令行</text>
  <line x1="200" y1="135" x2="250" y2="135" stroke="#4f46e5" stroke-width="2" marker-end="url(#D)"/>

  <rect x="254" y="90" width="190" height="90" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="349" y="120" font-size="15" font-weight="700" fill="#4338ca" text-anchor="middle">API 服务</text>
  <text x="349" y="148" font-size="12.5" fill="#475569" text-anchor="middle">接收请求 → 调 Agent →</text>
  <text x="349" y="168" font-size="12.5" fill="#475569" text-anchor="middle">返回结果（含鉴权/限流）</text>
  <line x1="444" y1="135" x2="494" y2="135" stroke="#4f46e5" stroke-width="2" marker-end="url(#D)"/>

  <rect x="498" y="90" width="170" height="90" rx="14" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
  <text x="583" y="120" font-size="15" font-weight="700" fill="#0f766e" text-anchor="middle">Agent 逻辑</text>
  <text x="583" y="148" font-size="12.5" fill="#115e59" text-anchor="middle">提示词+工具+记忆编排</text>
  <text x="583" y="168" font-size="12.5" fill="#115e59" text-anchor="middle">（可拆成独立服务）</text>
  <line x1="668" y1="135" x2="718" y2="135" stroke="#4f46e5" stroke-width="2" marker-end="url(#D)"/>

  <rect x="722" y="90" width="130" height="90" rx="14" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
  <text x="787" y="120" font-size="14.5" font-weight="700" fill="#b45309" text-anchor="middle">LLM API</text>
  <text x="787" y="148" font-size="12" fill="#92400e" text-anchor="middle">模型服务商</text>
  <text x="787" y="166" font-size="12" fill="#92400e" text-anchor="middle">（云端）</text>

  <rect x="180" y="230" width="520" height="90" rx="16" fill="#fff" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="440" y="262" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle">上生产前 checklist（摘要）</text>
  <text x="440" y="292" font-size="13.5" fill="#475569" text-anchor="middle">密钥走环境变量/密钥管理，绝不进代码库 · 日志脱敏 · 限流与额度告警</text>
  <text x="440" y="312" font-size="13.5" fill="#475569" text-anchor="middle">健康检查 · 优雅退出 · 版本可回滚 · 有评测集做上线前回归</text>
</svg>
