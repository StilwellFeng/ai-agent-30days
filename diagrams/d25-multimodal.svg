<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <text x="440" y="34" font-size="19" font-weight="700" fill="#1f2430" text-anchor="middle">多模态 Agent：从“只读文字”到“看懂世界”</text>

  <rect x="40" y="80" width="200" height="150" rx="16" fill="#fdf2f8" stroke="#ec4899" stroke-width="2"/>
  <text x="140" y="112" font-size="15.5" font-weight="700" fill="#be185d" text-anchor="middle">🖼 视觉输入</text>
  <text x="140" y="142" font-size="13" fill="#9d174d" text-anchor="middle">看懂截图、报表、图表、</text>
  <text x="140" y="164" font-size="13" fill="#9d174d" text-anchor="middle">发票、UI 界面</text>
  <text x="140" y="186" font-size="12.5" fill="#94a3b8" text-anchor="middle">→ “把这张表转成 Excel”</text>

  <rect x="260" y="80" width="200" height="150" rx="16" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="360" y="112" font-size="15.5" font-weight="700" fill="#4338ca" text-anchor="middle">🎧 音频输入</text>
  <text x="360" y="142" font-size="13" fill="#475569" text-anchor="middle">语音转文字、听懂会议</text>
  <text x="360" y="164" font-size="13" fill="#475569" text-anchor="middle">录音、语气</text>
  <text x="360" y="186" font-size="12.5" fill="#94a3b8" text-anchor="middle">→ “总结这通电话的待办”</text>

  <rect x="480" y="80" width="200" height="150" rx="16" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
  <text x="580" y="112" font-size="15.5" font-weight="700" fill="#0f766e" text-anchor="middle">🖱 操作界面</text>
  <text x="580" y="142" font-size="13" fill="#115e59" text-anchor="middle">看屏幕 → 点按钮 → 填表单</text>
  <text x="580" y="164" font-size="13" fill="#115e59" text-anchor="middle">（Computer Use 类能力）</text>
  <text x="580" y="186" font-size="12.5" fill="#94a3b8" text-anchor="middle">→ “帮我在网页里订票”</text>

  <rect x="700" y="80" width="140" height="150" rx="16" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
  <text x="770" y="112" font-size="15.5" font-weight="700" fill="#b45309" text-anchor="middle">📤 输出</text>
  <text x="770" y="142" font-size="13" fill="#92400e" text-anchor="middle">文字/图片/</text>
  <text x="770" y="164" font-size="13" fill="#92400e" text-anchor="middle">语音/文件/</text>
  <text x="770" y="186" font-size="13" fill="#92400e" text-anchor="middle">操作结果</text>

  <rect x="120" y="256" width="640" height="48" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="440" y="286" font-size="13.5" fill="#475569" text-anchor="middle">本质不变：还是“感知 → 规划 → 工具 → 行动”循环，只是感知与行动的模态变多了</text>
</svg>
