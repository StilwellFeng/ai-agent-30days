<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#66707f"/>
    </marker>
  </defs>

  <!-- AI outer -->
  <rect x="20" y="20" width="560" height="520" rx="26" fill="#f3f6ff" stroke="#4f46e5" stroke-width="2.5"/>
  <text x="300" y="62" font-size="24" font-weight="700" fill="#4f46e5" text-anchor="middle">人工智能 AI</text>
  <text x="300" y="86" font-size="13.5" fill="#66707f" text-anchor="middle">让机器表现出智能的总称（1950s 至今）</text>

  <!-- ML -->
  <rect x="55" y="110" width="490" height="180" rx="20" fill="#ffffff" stroke="#818cf8" stroke-width="2"/>
  <text x="300" y="146" font-size="20" font-weight="700" fill="#4338ca" text-anchor="middle">机器学习 ML</text>
  <text x="300" y="172" font-size="13.5" fill="#66707f" text-anchor="middle">从数据中自动学规律，而不是人工写死规则</text>

  <!-- DL -->
  <rect x="95" y="196" width="410" height="70" rx="16" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="300" y="226" font-size="18" font-weight="700" fill="#4338ca" text-anchor="middle">深度学习 DL</text>
  <text x="300" y="251" font-size="13.5" fill="#66707f" text-anchor="middle">用多层神经网络学习，图像/语音突破的主力</text>

  <!-- LLM -->
  <rect x="135" y="290" width="330" height="64" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="300" y="320" font-size="18" font-weight="700" fill="#6d28d9" text-anchor="middle">大语言模型 LLM</text>
  <text x="300" y="344" font-size="13.5" fill="#6d28d9" text-anchor="middle">GPT / Claude / Gemini / 文心 / DeepSeek…</text>

  <line x1="300" y1="290" x2="300" y2="268" stroke="#66707f" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="300" y1="196" x2="300" y2="180" stroke="#66707f" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- Agent on the side -->
  <rect x="610" y="110" width="230" height="210" rx="22" fill="#e6f7f4" stroke="#0d9488" stroke-width="2.5"/>
  <text x="725" y="152" font-size="22" font-weight="700" fill="#0f766e" text-anchor="middle">AI Agent</text>
  <text x="725" y="180" font-size="13.5" fill="#115e59" text-anchor="middle">以 LLM 为“大脑”，</text>
  <text x="725" y="202" font-size="13.5" fill="#115e59" text-anchor="middle">能自己定计划、调工具、</text>
  <text x="725" y="224" font-size="13.5" fill="#115e59" text-anchor="middle">看结果、改方案，</text>
  <text x="725" y="246" font-size="13.5" fill="#115e59" text-anchor="middle">一步步完成任务。</text>
  <text x="725" y="290" font-size="13" fill="#0f766e" text-anchor="middle">≈ 会“干活”的智能助手</text>

  <line x1="610" y1="215" x2="466" y2="215" stroke="#66707f" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="538" y="200" font-size="13" fill="#66707f" text-anchor="middle">站在 LLM 之上</text>

  <!-- Example boxes -->
  <rect x="55" y="388" width="240" height="132" rx="16" fill="#fff" stroke="#e5e8ef" stroke-width="1.5"/>
  <text x="175" y="416" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle">普通 AI 软件</text>
  <text x="175" y="444" font-size="13" fill="#66707f" text-anchor="middle">你问它答：聊天、翻译、</text>
  <text x="175" y="464" font-size="13" fill="#66707f" text-anchor="middle">写摘要、生成图片…</text>
  <text x="175" y="492" font-size="13" fill="#66707f" text-anchor="middle">不能替你“办事”</text>

  <rect x="320" y="388" width="260" height="132" rx="16" fill="#fdf2f8" stroke="#ec4899" stroke-width="2"/>
  <text x="450" y="416" font-size="15" font-weight="700" fill="#be185d" text-anchor="middle">AI Agent 应用</text>
  <text x="450" y="444" font-size="13" fill="#9d174d" text-anchor="middle">你给目标：订机票、查资料、</text>
  <text x="450" y="464" font-size="13" fill="#9d174d" text-anchor="middle">做报表、写代码…</text>
  <text x="450" y="492" font-size="13" fill="#9d174d" text-anchor="middle">它规划 + 动手 + 交付结果</text>

  <text x="300" y="376" font-size="12" fill="#66707f" text-anchor="middle">差别在于：能不能“自主行动”</text>
</svg>
