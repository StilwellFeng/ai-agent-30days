<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <text x="440" y="34" font-size="19" font-weight="700" fill="#1f2430" text-anchor="middle">组件地图：每个积木都在你学过的位置上</text>
  <rect x="40" y="70" width="240" height="86" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="160" y="100" font-size="16" font-weight="700" fill="#4338ca" text-anchor="middle">Chat Model / Prompt</text>
  <text x="160" y="126" font-size="13" fill="#475569" text-anchor="middle">= LLM + 提示词（Day 2/4/8）</text>
  <text x="160" y="146" font-size="12" fill="#94a3b8" text-anchor="middle">怎么想、按什么规矩想</text>

  <rect x="320" y="70" width="240" height="86" rx="14" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
  <text x="440" y="100" font-size="16" font-weight="700" fill="#0f766e" text-anchor="middle">Tool / Retriever</text>
  <text x="440" y="126" font-size="13" fill="#115e59" text-anchor="middle">= 工具 + 检索（Day 5/10/11）</text>
  <text x="440" y="146" font-size="12" fill="#94a3b8" text-anchor="middle">能做什么、能查到什么</text>

  <rect x="600" y="70" width="240" height="86" rx="14" fill="#fdf2f8" stroke="#ec4899" stroke-width="2"/>
  <text x="720" y="100" font-size="16" font-weight="700" fill="#be185d" text-anchor="middle">Memory / Agent</text>
  <text x="720" y="126" font-size="13" fill="#9d174d" text-anchor="middle">= 记忆 + 规划（Day 6/13）</text>
  <text x="720" y="146" font-size="12" fill="#94a3b8" text-anchor="middle">记住什么、怎么决定下一步</text>

  <rect x="150" y="190" width="580" height="72" rx="14" fill="#fff" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="440" y="222" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle">学习法：先跑通官方示例 → 逐行注释 → 改 3 处</text>
  <text x="440" y="248" font-size="13" fill="#475569" text-anchor="middle">API 会变，地图不变 —— 概念才是你真正学会的东西</text>
</svg>
