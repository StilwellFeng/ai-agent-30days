<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <text x="440" y="36" font-size="19" font-weight="700" fill="#1f2430" text-anchor="middle">Agent 的三种“记忆”</text>

  <rect x="40" y="70" width="250" height="180" rx="18" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="165" y="106" font-size="16.5" font-weight="700" fill="#4338ca" text-anchor="middle">🧩 工作记忆（上下文）</text>
  <text x="165" y="138" font-size="13" fill="#475569" text-anchor="middle">本轮对话里的所有内容，</text>
  <text x="165" y="162" font-size="13" fill="#475569" text-anchor="middle">全部塞给 LLM 一起看</text>
  <text x="165" y="192" font-size="12.5" fill="#94a3b8" text-anchor="middle">特点：直接但容量有限</text>
  <text x="165" y="214" font-size="12.5" fill="#94a3b8" text-anchor="middle">（受上下文窗口限制）</text>
  <text x="165" y="238" font-size="12" fill="#64748b" text-anchor="middle">= 你的“正在想的事”</text>

  <rect x="315" y="70" width="250" height="180" rx="18" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
  <text x="440" y="106" font-size="16.5" font-weight="700" fill="#0f766e" text-anchor="middle">📁 长期记忆（外部存储）</text>
  <text x="440" y="138" font-size="13" fill="#115e59" text-anchor="middle">向量数据库 / 文件 / 数据库</text>
  <text x="440" y="162" font-size="13" fill="#115e59" text-anchor="middle">存放知识、用户偏好、历史</text>
  <text x="440" y="192" font-size="12.5" fill="#94a3b8" text-anchor="middle">特点：容量大、按需取用</text>
  <text x="440" y="238" font-size="12" fill="#64748b" text-anchor="middle">= 你的“笔记本 / 图书馆”</text>

  <rect x="590" y="70" width="250" height="180" rx="18" fill="#fdf2f8" stroke="#ec4899" stroke-width="2"/>
  <text x="715" y="106" font-size="16.5" font-weight="700" fill="#be185d" text-anchor="middle">🕘 会话记忆（短期）</text>
  <text x="715" y="138" font-size="13" fill="#9d174d" text-anchor="middle">上一次对话聊过什么</text>
  <text x="715" y="162" font-size="13" fill="#9d174d" text-anchor="middle">跨轮次保持连贯</text>
  <text x="715" y="192" font-size="12.5" fill="#94a3b8" text-anchor="middle">特点：会话结束可清空</text>
  <text x="715" y="238" font-size="12" fill="#64748b" text-anchor="middle">= 你的“昨天聊到哪了”</text>

  <!-- retrieval flow -->
  <rect x="120" y="286" width="640" height="96" rx="16" fill="#f6f7fb" stroke="#e5e8ef"/>
  <text x="440" y="316" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle">长期记忆怎么“想起来”？—— 检索流程</text>
  <text x="160" y="352" font-size="13" fill="#475569" text-anchor="middle">问题 → 转成向量（数字）→ 在库里找“语义最接近”的片段 → 把片段塞进上下文 → LLM 回答</text>
  <text x="440" y="374" font-size="12" fill="#94a3b8" text-anchor="middle">这套方法叫 RAG（检索增强生成），第 11 天会详细学</text>
</svg>
